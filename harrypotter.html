<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Harry Potter | TinyTale</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="harry.css">

</head>

<body>

<div class="overlay"></div>

<div class="container">

<h1>Welcome to the Wizarding World</h1>

<p>
Your magical adventure begins here.
Choose your destination below.
</p>

<div class="season-card">

<h2>Season 1</h2>

<button class="episode-btn" id="trailerBtn">
🎬 Trailer
</button>

<button class="episode-btn" id="episode1Btn">
⚡ Episode 1
</button>

<button class="locked">
🔒 Episode 2
</button>

<button class="locked">
🔒 Episode 3
</button>

<button class="locked">
🔒 Episode 4
</button>

<button class="locked">
🔒 Episode 5
</button>

<button class="locked">
🔒 Episode 6
</button>

</div>

</div>

<div id="popup">

<div class="popup-box">

<h3>Coming Soon</h3>

<p>
This episode is still being crafted.
Please check back later.
</p>

<button id="closePopup">
Close
</button>

</div>

</div>

<script src="harry.js"></script>

</body>

</html>
