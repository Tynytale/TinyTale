<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TinyTale Player</title>

    <meta name="theme-color" content="#13231F">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="player.css">
</head>

<body>

    <!-- Background -->
    <div class="background"></div>
    <div class="overlay"></div>

    <!-- Floating Particles -->
    <div class="particles">
        <span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span>
    </div>

    <!-- Loading -->
    <div id="loadingScreen">
        <div class="loader"></div>
        <h2>Loading Magic...</h2>
    </div>

    <!-- Main Player -->
    <main id="playerContainer" class="container">

        <header class="header">
            <h1 id="episodeTitle">Loading...</h1>
            <p id="episodeInfo">Please wait...</p>
        </header>

        <!-- Video -->
        <section class="videoSection">
            <div class="videoCard">
                <iframe
                    id="videoPlayer"
                    src=""
                    title="TinyTale Player"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                    allowfullscreen>
                </iframe>
            </div>
        </section>

        <!-- Story -->
        <section class="storySection">
            <div class="storyCard">
                <h2>Story</h2>
                <div id="storyContent"></div>
            </div>
        </section>

        <!-- Previous / Next -->
        <section class="navigation">
            <button id="prevBtn">⬅ Previous</button>
            <button id="nextBtn">Next ➜</button>
        </section>

        <!-- Dynamic Buttons -->
        <section class="partsSection">

            <h2 id="sectionTitle">Loading...</h2>

            <div id="partsContainer">
                <!-- JS Generates Buttons -->
            </div>

        </section>

    </main>

    <!-- Popup -->
    <div id="popup">
        <div class="popupBox">

            <h2>Coming Soon</h2>

            <p>
                This content hasn't been released yet.
            </p>

            <button id="closePopup">
                Close
            </button>

        </div>
    </div>

    <script src="player.js"></script>

</body>

</html>
