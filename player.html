<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Player | TinyTale</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="player.css">

</head>

<body>

<div class="overlay"></div>

<div class="container">

<h1 id="episodeTitle">
Harry Potter
</h1>

<p class="subtitle">
Season 1 • Episode 1
</p>

<div class="video-card">

<iframe
id="videoPlayer"
src=""
title="TinyTale Player"
allowfullscreen>
</iframe>

</div>

<div class="story-card">

<h2>Story</h2>

<div id="storyContent">

Loading story...

</div>

</div>

<div class="navigation">

<button id="prevBtn">
⬅ Previous Part
</button>

<button id="nextBtn">
Next Part ➜
</button>

</div>

<div class="parts">

<button class="part active">
Part 1
</button>

<button class="part">
Part 2
</button>

<button class="part">
Part 3
</button>

<button class="part">
Part 4
</button>

<button class="part">
Part 5
</button>

</div>

</div>

<script src="player.js"></script>

</body>

</html>
