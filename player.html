<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TinyTale Player</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="player.css">

</head>

<body>

<div class="overlay"></div>

<div class="container">

<h1 id="episodeTitle">Loading...</h1>

<p id="episodeType"></p>

<div class="video-card">

<iframe
id="videoPlayer"
allowfullscreen
allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture">
</iframe>

</div>

<div class="story-card">

<h2>Story</h2>

<div id="storyContent">

Loading...

</div>

</div>

<div class="navigation">

<button id="prevBtn">⬅ Previous</button>

<button id="nextBtn">Next ➜</button>

</div>

<div id="parts" class="parts"></div>

</div>

<script src="player.js"></script>

</body>

</html>
