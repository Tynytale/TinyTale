<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TinyTale Player</title>

<meta name="theme-color" content="#13231F">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="player.css">

</head>

<body>

<!-- Background -->

<div class="background"></div>

<div class="overlay"></div>

<!-- Floating Magic -->

<div class="particles">

<span></span>
<span></span>
<span></span>
<span></span>
<span></span>
<span></span>
<span></span>
<span></span>
<span></span>
<span></span>
<span></span>
<span></span>

</div>

<!-- Loading -->

<div id="loadingScreen">

<div class="loader"></div>

<h2>Loading Magic...</h2>

</div>

<!-- Main -->

<main id="playerContainer" class="container">

<header class="header">

<h1 id="episodeTitle">

Loading...

</h1>

<p id="episodeInfo">

Preparing your adventure...

</p>

</header>

<section class="videoSection">

<div class="videoCard">

<iframe

id="videoPlayer"

src=""

title="TinyTale Player"

allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"

allowfullscreen>

</iframe>

</div>

</section>

<section class="storySection">

<div class="storyCard">

<h2>

Story

</h2>

<div id="storyContent">

Loading story...

</div>

</div>

</section>

<section class="navigation">

<button id="prevBtn">

⬅ Previous

</button>

<button id="nextBtn">

Next ➜

</button>

</section>

<section class="partsSection">

<h3>

Parts

</h3>

<div id="partsContainer">

<!-- Generated by player.js -->

</div>

</section>

</main>

<!-- Popup -->

<div id="popup">

<div class="popupBox">

<h2>

Coming Soon

</h2>

<p>

This part hasn't been released yet.

</p>

<button id="closePopup">

Close

</button>

</div>

</div>

<script src="player.js"></script>

</body>

</html>
